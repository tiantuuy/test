name: Kernel From Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # 每6小时

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch updates
        run: |
          curl -s "https://api.telegram.org/bot$TOKEN/getUpdates" > updates.json

      - name: Extract kernel file list
        run: |
          jq -r --arg CHAT "$CHAT_ID" '
            .result[]
            | select(.message.chat.id|tostring==$CHAT)
            | .message.document.file_name
          ' updates.json > all_files.txt

      - name: Detect latest version
        id: ver
        run: |
          VER=$(grep -oP '[0-9]+\.[0-9]+\.[0-9]+-flippy-[0-9]+\+' all_files.txt | sort -V | tail -n1)
          echo "Latest version: $VER"
          echo "ver=$VER" >> $GITHUB_OUTPUT

      - name: Download 4 kernel files
        run: |
          mkdir -p dl
          VER=${{ steps.ver.outputs.ver }}

          jq -c --arg CHAT "$CHAT_ID" --arg VER "$VER" '
            .result[]
            | select(.message.chat.id|tostring==$CHAT)
            | select(.message.document.file_name | contains($VER))
            | .message.document
          ' updates.json > docs.json

          for row in $(cat docs.json); do
            FILE_ID=$(echo $row | jq -r '.file_id')
            FILE_NAME=$(echo $row | jq -r '.file_name')

            if [[ "$FILE_NAME" == header-* || "$FILE_NAME" == modules-* || "$FILE_NAME" == boot-* || "$FILE_NAME" == dtb-amlogic-* ]]; then
              echo "Downloading $FILE_NAME"

              curl -s "https://api.telegram.org/bot$TOKEN/getFile?file_id=$FILE_ID" > file.json
              FILE_PATH=$(jq -r '.result.file_path' file.json)

              curl -L -o "dl/$FILE_NAME" \
                "https://api.telegram.org/file/bot$TOKEN/$FILE_PATH"
            fi
          done

      - name: Pack kernel bundle
        run: |
          VER=${{ steps.ver.outputs.ver }}
          tar -czf "$VER.tar.gz" -C dl .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel_stable
          name: Kernel Stable
          files: |
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
