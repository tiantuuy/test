name: CF Japan Best IP (Free FOFA)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  cf-ip:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y grep sed gawk netcat-openbsd curl

      - name: Fetch FOFA Japan Cloudflare HTML
        run: |
          > ip_raw.txt
          
          # 构建base64查询
          QUERY_STRING='server=="cloudflare" && country=="JP"'
          ENCODED_QUERY=$(echo -n "$QUERY_STRING" | base64 -w0)
          
          echo "查询字符串: $QUERY_STRING"
          echo "Base64编码: $ENCODED_QUERY"
          
          # 获取第一页数据
          URL="https://fofa.info/result?qbase64=$ENCODED_QUERY&page=1&page_size=20"
          echo "请求URL: $URL"
          
          # 下载页面内容用于调试
          curl -s -L "$URL" > fofa_response.html
          
          # 检查文件大小
          echo "响应文件大小: $(wc -l < fofa_response.html) 行"
          
          # 提取IP地址
          grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' fofa_response.html > ip_raw.txt
          
          # 如果没有提取到IP，显示部分内容用于调试
          if [ ! -s ip_raw.txt ]; then
            echo "警告: 没有提取到IP地址，显示前500个字符用于调试:"
            head -c 500 fofa_response.html
          else
            echo "成功提取到 $(wc -l < ip_raw.txt) 个IP地址"
          fi
          
          sort -u ip_raw.txt -o ip_raw.txt

      - name: Detect open CF ports
        run: |
          > ip_port.txt
          total_ips=$(wc -l < ip_raw.txt)
          echo "开始检测 $total_ips 个IP的端口连通性"
          
          count=0
          while read ip; do
            count=$((count + 1))
            for p in 443 80; do
              if nc -z -w1 $ip $p 2>/dev/null; then
                echo "$ip:$p" >> ip_port.txt
                echo "✓ $ip:$p 可连通"
              fi
            done
            # 每10个IP显示一次进度
            if [ $((count % 10)) -eq 0 ]; then
              echo "进度: $count/$total_ips"
            fi
          done < ip_raw.txt
          
          echo "检测完成，找到 $(wc -l < ip_port.txt) 个可连通的IP:端口"

      - name: TCP latency test
        run: |
          > ip_latency.txt
          total_ports=$(wc -l < ip_port.txt)
          echo "开始测试 $total_ports 个端口的延迟"
          
          count=0
          while read line; do
            count=$((count + 1))
            ip=$(echo $line | cut -d: -f1)
            port=$(echo $line | cut -d: -f2)
            
            # 测试延迟
            t=$( (time -p nc -z -w2 $ip $port) 2>&1 | awk '/real/ {print $2}')
            if [ ! -z "$t" ]; then
              echo "$t $ip $port" >> ip_latency.txt
              echo "$ip:$port 延迟: ${t}s"
            fi
            
            # 每5个显示一次进度
            if [ $((count % 5)) -eq 0 ]; then
              echo "延迟测试进度: $count/$total_ports"
            fi
          done < ip_port.txt
          
          if [ -s ip_latency.txt ]; then
            sort -n ip_latency.txt -o ip_latency.txt
            head -n 30 ip_latency.txt > best_cf_jp.txt
            echo "最佳30个IP:"
            cat best_cf_jp.txt
          else
            echo "没有找到可用的IP"
            touch best_cf_jp.txt
          fi

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: cf_japan_best_ip
          path: |
            ip_raw.txt
            ip_port.txt
            best_cf_jp.txt
            fofa_response.html
