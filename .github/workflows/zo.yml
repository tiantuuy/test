name: Test Zo API

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"
  

jobs:
  test-api:
    runs-on: ubuntu-latest

    env:
      ZO_API_KEY: ${{ secrets.ZO_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run API test script
        run: |
          python test_zo_api.py \
            
      
