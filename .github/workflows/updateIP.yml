name: Update IP Lists

on:
  schedule:
    - cron: "13 04 * * *"   # 每6小时运行一次
  workflow_dispatch:        # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run parser
        run: python parse_ips.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add jp.txt us.txt sg.txt de.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update IP lists"
            git push
          fi
      - name: Delete all workflow runs except today
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%Y-%m-%d)

          page=1
          while :; do
            response=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?per_page=100&page=$page")

            ids=$(echo "$response" | jq -r --arg today "$today" '
              .workflow_runs[]
              | select(.created_at[0:10] != $today)
              | .id
            ')

            if [ -z "$ids" ]; then
              break
            fi

            for id in $ids; do
              echo "Deleting run $id"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$id"
            done

            page=$((page+1))
          done
