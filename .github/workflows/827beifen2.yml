name: Kernel LTS Stable

on:
  workflow_dispatch:

  schedule:
    # 每周四 04:33 UTC
    # 北京时间每周四 12:33
    - cron: "33 04 * * 4"


# ============================================================
# GitHub 权限
# ============================================================

permissions:
  contents: write


# ============================================================
# 防止同一个 Workflow 同时运行
#
# 如果手动运行和定时任务撞车：
#
# 第一个继续运行
# 第二个等待
#
# 不取消正在下载 Telegram 文件的任务。
# ============================================================

concurrency:
  group: kernel-lts
  cancel-in-progress: false


jobs:

  kernel:

    name: Update Kernel LTS

    runs-on: ubuntu-latest

    timeout-minutes: 120


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ======================================================
      # Python
      #
      # 注意：
      # 这里故意不使用 cache: pip
      #
      # 因为当前项目没有 requirements.txt / pyproject.toml。
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: false


      # ======================================================
      # Python dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install telethon


      # ======================================================
      # Restore Telegram session
      # ======================================================

      - name: Restore Telegram session
        shell: bash
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |

          set -euo pipefail

          if [ -z "$TG_SESSION" ]; then
            echo "::error::TG_SESSION secret is empty"
            exit 1
          fi

          printf '%s' "$TG_SESSION" \
            | base64 --decode \
            > tg.session

          chmod 600 tg.session

          if [ ! -s tg.session ]; then
            echo "::error::tg.session is empty"
            exit 1
          fi

          echo "Telegram session restored"


      # ======================================================
      # Run kernel downloader
      # ======================================================

      - name: Get latest LTS kernels
        id: kernel
        shell: bash
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
          CHAT_ID: ${{ secrets.TG_CHAT_IDFLIPPY }}

          # Telegram 最近扫描 300 条
          SCAN_LIMIT: "300"

        run: |

          set -euo pipefail

          python kr2.py


      # ======================================================
      # Display result
      # ======================================================

      - name: Show kernel result
        id: result
        shell: bash
        run: |

          set -euo pipefail

          if [ ! -f kernel-result.json ]; then
            echo "::error::kernel-result.json not found"
            exit 1
          fi

          echo "=========================================="
          echo "Kernel result"
          echo "=========================================="

          cat kernel-result.json

          echo

          CHANGED=$(jq -r '.changed | length' kernel-result.json)

          echo "changed_count=$CHANGED" \
            >> "$GITHUB_OUTPUT"

          if [ "$CHANGED" -gt 0 ]; then

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

            echo "Kernel update detected"

          else

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

            echo "No kernel update"

          fi


      # ======================================================
      # Validate Release files
      #
      # Python 此时生成的还是：
      #
      # release/kernel-6.1.tar.gz
      # release/kernel-6.12.tar.gz
      # release/kernel-6.18.tar.gz
      #
      # Rename 会在这个步骤之后执行。
      # ======================================================

      - name: Validate release archives
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Generated release archives"
          echo "=========================================="

          ls -lh release/

          echo

          for series in 6.1 6.12 6.18; do

            FILE="release/kernel-${series}.tar.gz"

            if [ ! -f "$FILE" ]; then

              echo "::error::Missing archive: $FILE"

              exit 1

            fi

            SIZE=$(stat -c%s "$FILE")

            if [ "$SIZE" -le 0 ]; then

              echo "::error::Archive is empty: $FILE"

              exit 1

            fi

            echo "$FILE : $SIZE bytes"

          done


      # ======================================================
      # Validate 6.1 archive
      #
      # 确保 RK35xx + RK3588 都存在。
      #
      # 6.1 必须包含：
      #
      # 8 files
      # ======================================================

      - name: Validate 6.1 archive
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Validating 6.1 archive"
          echo "=========================================="

          rm -rf verify-61

          mkdir -p verify-61

          tar -xzf \
            release/kernel-6.1.tar.gz \
            -C verify-61

          echo "Archive contents:"

          find verify-61 \
            -type f \
            -print \
            | sort

          echo

          COUNT=$(find verify-61 \
            -type f \
            | wc -l)

          echo "6.1 file count: $COUNT"

          if [ "$COUNT" -ne 8 ]; then

            echo "::error::6.1 archive should contain 8 files, found $COUNT"

            exit 1

          fi

          echo "6.1 archive OK"


      # ======================================================
      # Rename archives with version
      #
      # 原始：
      #
      # kernel-6.1.tar.gz
      # kernel-6.12.tar.gz
      # kernel-6.18.tar.gz
      #
      # 最终：
      #
      # 6.1.145-flippy-2609a.tar.gz
      # 6.12.45-flippy-95+o.tar.gz
      # 6.18.45-flippy-95+.tar.gz
      #
      # 注意：
      # 不再加 kernel- 前缀。
      # ======================================================

      - name: Rename archives with version
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          # --------------------------------------------------
          # 从 latest.json 读取当前版本
          #
          # latest.json 保持简单格式：
          #
          # {
          #   "6.1": "6.1.145-flippy-2609a",
          #   "6.12": "6.12.45-flippy-95+o",
          #   "6.18": "6.18.45-flippy-95+"
          # }
          # --------------------------------------------------

          VERSION_61=$(jq -r '.["6.1"]' latest.json)
          VERSION_612=$(jq -r '.["6.12"]' latest.json)
          VERSION_618=$(jq -r '.["6.18"]' latest.json)

          echo "6.1 version: $VERSION_61"
          echo "6.12 version: $VERSION_612"
          echo "6.18 version: $VERSION_618"

          # --------------------------------------------------
          # 检查版本号是否有效
          # --------------------------------------------------

          if [ -z "$VERSION_61" ] || [ "$VERSION_61" = "null" ]; then
            echo "::error::6.1 version is empty"
            exit 1
          fi

          if [ -z "$VERSION_612" ] || [ "$VERSION_612" = "null" ]; then
            echo "::error::6.12 version is empty"
            exit 1
          fi

          if [ -z "$VERSION_618" ] || [ "$VERSION_618" = "null" ]; then
            echo "::error::6.18 version is empty"
            exit 1
          fi

          # --------------------------------------------------
          # 重命名
          # --------------------------------------------------

          cd release

          mv \
            "kernel-6.1.tar.gz" \
            "${VERSION_61}.tar.gz"

          mv \
            "kernel-6.12.tar.gz" \
            "${VERSION_612}.tar.gz"

          mv \
            "kernel-6.18.tar.gz" \
            "${VERSION_618}.tar.gz"

          echo "=========================================="
          echo "Renamed release archives"
          echo "=========================================="

          ls -lh


      # ======================================================
      # Validate renamed archives
      #
      # 确认最终准备上传到 GitHub Release 的文件存在。
      # ======================================================

      - name: Validate renamed archives
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Validating renamed archives"
          echo "=========================================="

          VERSION_61=$(jq -r '.["6.1"]' latest.json)
          VERSION_612=$(jq -r '.["6.12"]' latest.json)
          VERSION_618=$(jq -r '.["6.18"]' latest.json)

          for VERSION in \
            "$VERSION_61" \
            "$VERSION_612" \
            "$VERSION_618"
          do

            FILE="release/${VERSION}.tar.gz"

            if [ ! -f "$FILE" ]; then

              echo "::error::Missing archive: $FILE"

              exit 1

            fi

            SIZE=$(stat -c%s "$FILE")

            if [ "$SIZE" -le 0 ]; then

              echo "::error::Archive is empty: $FILE"

              exit 1

            fi

            echo "$FILE : $SIZE bytes"

          done

          echo

          echo "All renamed archives are valid"


      # ======================================================
      # Commit latest.json
      #
      # 只有 Python 已经完成：
      #
      # 下载
      # ↓
      # 完整性检查
      # ↓
      # 打包
      #
      # 才会进入这里。
      # ======================================================

      - name: Commit kernel state
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json

          if git diff --cached --quiet; then

            echo "No state changes to commit"

            exit 0

          fi

          git commit \
            -m "update LTS kernel versions"

          echo "Fetching latest remote main..."

          git fetch origin main

          echo "Rebasing local commit..."

          git rebase origin/main

          echo "Pushing updated main..."

          git push origin HEAD:main


      # ======================================================
      # Publish / update GitHub Release
      #
      # 固定：
      #
      # Release:
      #   Kernel LTS Stable
      #
      # Tag:
      #   kernel_lts
      #
      # 每次只上传本次运行产生的新版本文件。
      #
      # 历史版本继续保留在 GitHub Release。
      # ======================================================

      - name: Publish Kernel Release
        if: steps.result.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:

          # --------------------------------------------------
          # 固定 Release Tag
          # --------------------------------------------------

          tag_name: kernel_stable

          # --------------------------------------------------
          # 固定 Release 名称
          # --------------------------------------------------

          name: kernel_stable

          # --------------------------------------------------
          # 上传本次生成的版本文件
          #
          # 例如：
          #
          # 6.1.145-flippy-2609a.tar.gz
          # 6.12.45-flippy-95+o.tar.gz
          # 6.18.45-flippy-95+.tar.gz
          #
          # 不再上传 kernel-6.1.tar.gz
          # --------------------------------------------------

          files: |
            release/*.tar.gz

          # --------------------------------------------------
          # 同名版本不覆盖
          #
          # 例如：
          #
          # 6.18.45-flippy-95+.tar.gz
          #
          # 已经存在时，不覆盖。
          #
          # 新版本：
          #
          # 6.18.46-flippy-95+.tar.gz
          #
          # 会作为新的 Asset 加进去。
          # --------------------------------------------------

          overwrite_files: false

          # --------------------------------------------------
          # 文件不存在则失败
          # --------------------------------------------------

          fail_on_unmatched_files: true

          # --------------------------------------------------
          # Release 说明
          # --------------------------------------------------

          body: |
            # kernel_stable

            Automatically maintained Flippy OpenWrt LTS kernels.

            Supported kernel series:

            - Linux 6.1
            - Linux 6.12
            - Linux 6.18

            The files are automatically detected from the
            Flippy OpenWrt Telegram channel.

            Linux 6.1 contains both hardware targets:

            - RK35xx
            - RK3588

            Current kernel versions are recorded in `latest.json`.

            Each kernel version is published as an independent
            release asset.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # Cleanup
      # ======================================================

      - name: Cleanup Telegram session
        if: always()
        shell: bash
        run: |

          rm -f tg.session
