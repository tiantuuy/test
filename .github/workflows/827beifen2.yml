name: Kernel LTS Stable

on:
  workflow_dispatch:

  schedule:
    # 每周四 04:33 UTC
    # 北京时间每周四 12:33
    - cron: "33 04 * * 4"


# ============================================================
# GitHub 权限
# ============================================================

permissions:
  contents: write


# ============================================================
# 防止同一个 Workflow 同时运行
# ============================================================

concurrency:
  group: kernel-lts
  cancel-in-progress: false


jobs:

  kernel:

    name: Update Kernel LTS

    runs-on: ubuntu-latest

    timeout-minutes: 120


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: false


      # ======================================================
      # Python dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install telethon


      # ======================================================
      # Restore Telegram session
      # ======================================================

      - name: Restore Telegram session
        shell: bash
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |

          set -euo pipefail

          if [ -z "$TG_SESSION" ]; then
            echo "::error::TG_SESSION secret is empty"
            exit 1
          fi

          printf '%s' "$TG_SESSION" \
            | base64 --decode \
            > tg.session

          chmod 600 tg.session

          if [ ! -s tg.session ]; then
            echo "::error::tg.session is empty"
            exit 1
          fi

          echo "Telegram session restored"


      # ======================================================
      # Run kernel downloader
      #
      # kr2.py 生成：
      #
      # kernel-6.1-rk35xx.tar.gz
      # kernel-6.1-rk3588.tar.gz
      # kernel-6.1.tar.gz
      # kernel-6.12.tar.gz
      # kernel-6.18.tar.gz
      # ======================================================

      - name: Get latest LTS kernels
        id: kernel
        shell: bash
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
          CHAT_ID: ${{ secrets.TG_CHAT_IDFLIPPY }}

          # Telegram 最近扫描 300 条
          SCAN_LIMIT: "300"

        run: |

          set -euo pipefail

          python kr2.py


      # ======================================================
      # Display result
      # ======================================================

      - name: Show kernel result
        id: result
        shell: bash
        run: |

          set -euo pipefail

          if [ ! -f kernel-result.json ]; then
            echo "::error::kernel-result.json not found"
            exit 1
          fi

          echo "=========================================="
          echo "Kernel result"
          echo "=========================================="

          cat kernel-result.json

          echo

          CHANGED=$(jq -r '.changed | length' kernel-result.json)

          echo "changed_count=$CHANGED" \
            >> "$GITHUB_OUTPUT"

          if [ "$CHANGED" -gt 0 ]; then

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

            echo "Kernel update detected"

          else

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

            echo "No kernel update"

          fi


      # ======================================================
      # Validate latest.json
      #
      # 必须包含：
      #
      # 6.1
      # 6.1-rk35xx
      # 6.1-rk3588
      # 6.12
      # 6.18
      # ======================================================

      - name: Validate latest.json
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          if [ ! -f latest.json ]; then
            echo "::error::latest.json not found"
            exit 1
          fi

          echo "=========================================="
          echo "Validating latest.json"
          echo "=========================================="

          cat latest.json

          echo

          for SERIES in \
            "6.1" \
            "6.1-rk35xx" \
            "6.1-rk3588" \
            "6.12" \
            "6.18"
          do

            VERSION=$(jq -r --arg series "$SERIES" '.[$series]' latest.json)

            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then

              echo "::error::Missing version for $SERIES"

              exit 1

            fi

            echo "$SERIES = $VERSION"

          done

          echo
          echo "latest.json OK"


      # ======================================================
      # Validate release archives
      #
      # kr2.py 必须生成 5 个文件
      # ======================================================

      - name: Validate release archives
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Generated release archives"
          echo "=========================================="

          ls -lh release/

          echo

          for FILE in \
            "release/kernel-6.1-rk35xx.tar.gz" \
            "release/kernel-6.1-rk3588.tar.gz" \
            "release/kernel-6.1.tar.gz" \
            "release/kernel-6.12.tar.gz" \
            "release/kernel-6.18.tar.gz"
          do

            if [ ! -f "$FILE" ]; then

              echo "::error::Missing archive: $FILE"

              exit 1

            fi

            SIZE=$(stat -c%s "$FILE")

            if [ "$SIZE" -le 0 ]; then

              echo "::error::Archive is empty: $FILE"

              exit 1

            fi

            echo "$FILE : $SIZE bytes"

          done


      # ======================================================
      # Validate 6.1 archive
      #
      # kernel-6.1.tar.gz
      #
      # 必须包含 8 files
      # ======================================================

      - name: Validate 6.1 archive
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Validating 6.1 archive"
          echo "=========================================="

          rm -rf verify-61

          mkdir -p verify-61

          tar -xzf \
            release/kernel-6.1.tar.gz \
            -C verify-61

          echo "Archive contents:"

          find verify-61 \
            -type f \
            -print \
            | sort

          echo

          COUNT=$(find verify-61 \
            -type f \
            | wc -l)

          echo "6.1 file count: $COUNT"

          if [ "$COUNT" -ne 8 ]; then

            echo "::error::6.1 archive should contain 8 files, found $COUNT"

            exit 1

          fi

          echo "6.1 archive OK"


      # ======================================================
      # Prepare release directories
      #
      # 最终目录结构：
      #
      # release/
      #
      # ├── kernel_stable/
      # │   ├── 6.1.xxxxx.tar.gz
      # │   ├── 6.12.xxxxx.tar.gz
      # │   └── 6.18.xxxxx.tar.gz
      # │
      # ├── 6.1-rk35xx/
      # │   └── 6.1.xxxxx.tar.gz
      # │
      # └── 6.1-rk3588/
      #     └── 6.1.xxxxx.tar.gz
      #
      # 使用独立目录避免不同 Release 上传文件时互相匹配。
      # ======================================================

      - name: Prepare release files
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          VERSION_61=$(jq -r '.["6.1"]' latest.json)
          VERSION_61_RK35XX=$(jq -r '.["6.1-rk35xx"]' latest.json)
          VERSION_61_RK3588=$(jq -r '.["6.1-rk3588"]' latest.json)
          VERSION_612=$(jq -r '.["6.12"]' latest.json)
          VERSION_618=$(jq -r '.["6.18"]' latest.json)

          echo "6.1          = $VERSION_61"
          echo "6.1-rk35xx   = $VERSION_61_RK35XX"
          echo "6.1-rk3588   = $VERSION_61_RK3588"
          echo "6.12         = $VERSION_612"
          echo "6.18         = $VERSION_618"

          echo

          # --------------------------------------------------
          # 检查版本号
          # --------------------------------------------------

          for VERSION in \
            "$VERSION_61" \
            "$VERSION_61_RK35XX" \
            "$VERSION_61_RK3588" \
            "$VERSION_612" \
            "$VERSION_618"
          do

            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then

              echo "::error::Kernel version is empty"

              exit 1

            fi

          done


          # --------------------------------------------------
          # 创建三个 Release 对应目录
          # --------------------------------------------------

          rm -rf release/kernel_stable
          rm -rf release/6.1-rk35xx
          rm -rf release/6.1-rk3588

          mkdir -p release/kernel_stable
          mkdir -p release/6.1-rk35xx
          mkdir -p release/6.1-rk3588


          # --------------------------------------------------
          # kernel_stable
          #
          # 6.1
          # 6.12
          # 6.18
          # --------------------------------------------------

          mv \
            "release/kernel-6.1.tar.gz" \
            "release/kernel_stable/${VERSION_61}.tar.gz"

          mv \
            "release/kernel-6.12.tar.gz" \
            "release/kernel_stable/${VERSION_612}.tar.gz"

          mv \
            "release/kernel-6.18.tar.gz" \
            "release/kernel_stable/${VERSION_618}.tar.gz"


          # --------------------------------------------------
          # 6.1-rk35xx
          # --------------------------------------------------

          mv \
            "release/kernel-6.1-rk35xx.tar.gz" \
            "release/6.1-rk35xx/${VERSION_61_RK35XX}.tar.gz"


          # --------------------------------------------------
          # 6.1-rk3588
          # --------------------------------------------------

          mv \
            "release/kernel-6.1-rk3588.tar.gz" \
            "release/6.1-rk3588/${VERSION_61_RK3588}.tar.gz"


          echo "=========================================="
          echo "Prepared release files"
          echo "=========================================="

          find release \
            -maxdepth 2 \
            -type f \
            -print \
            | sort


      # ======================================================
      # Validate prepared release files
      # ======================================================

      - name: Validate prepared release files
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          VERSION_61=$(jq -r '.["6.1"]' latest.json)
          VERSION_61_RK35XX=$(jq -r '.["6.1-rk35xx"]' latest.json)
          VERSION_61_RK3588=$(jq -r '.["6.1-rk3588"]' latest.json)
          VERSION_612=$(jq -r '.["6.12"]' latest.json)
          VERSION_618=$(jq -r '.["6.18"]' latest.json)


          # --------------------------------------------------
          # kernel_stable
          # --------------------------------------------------

          for FILE in \
            "release/kernel_stable/${VERSION_61}.tar.gz" \
            "release/kernel_stable/${VERSION_612}.tar.gz" \
            "release/kernel_stable/${VERSION_618}.tar.gz"
          do

            if [ ! -f "$FILE" ]; then

              echo "::error::Missing archive: $FILE"

              exit 1

            fi

            SIZE=$(stat -c%s "$FILE")

            if [ "$SIZE" -le 0 ]; then

              echo "::error::Archive is empty: $FILE"

              exit 1

            fi

            echo "$FILE : $SIZE bytes"

          done


          # --------------------------------------------------
          # 6.1-rk35xx
          # --------------------------------------------------

          FILE="release/6.1-rk35xx/${VERSION_61_RK35XX}.tar.gz"

          if [ ! -f "$FILE" ]; then

            echo "::error::Missing archive: $FILE"

            exit 1

          fi

          SIZE=$(stat -c%s "$FILE")

          if [ "$SIZE" -le 0 ]; then

            echo "::error::Archive is empty: $FILE"

            exit 1

          fi

          echo "$FILE : $SIZE bytes"


          # --------------------------------------------------
          # 6.1-rk3588
          # --------------------------------------------------

          FILE="release/6.1-rk3588/${VERSION_61_RK3588}.tar.gz"

          if [ ! -f "$FILE" ]; then

            echo "::error::Missing archive: $FILE"

            exit 1

          fi

          SIZE=$(stat -c%s "$FILE")

          if [ "$SIZE" -le 0 ]; then

            echo "::error::Archive is empty: $FILE"

            exit 1

          fi

          echo "$FILE : $SIZE bytes"


          echo
          echo "All release files are valid"


      # ======================================================
      # Commit latest.json
      # ======================================================

      - name: Commit kernel state
        if: steps.result.outputs.changed == 'true'
        shell: bash
        run: |

          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.json

          if git diff --cached --quiet; then

            echo "No state changes to commit"

            exit 0

          fi

          git commit \
            -m "update LTS kernel versions"

          echo "Fetching latest remote main..."

          git fetch origin main

          echo "Rebasing local commit..."

          git rebase origin/main

          echo "Pushing updated main..."

          git push origin HEAD:main


      # ======================================================
      # Publish kernel_stable
      #
      # Tag:
      #   kernel_stable
      #
      # 上传：
      #
      # 6.1
      # 6.12
      # 6.18
      # ======================================================

      - name: Publish kernel_stable Release
        if: steps.result.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:

          tag_name: kernel_stable

          name: kernel_stable

          files: |
            release/kernel_stable/*.tar.gz

          overwrite_files: false

          fail_on_unmatched_files: true

          body: |
            # kernel_stable

            Automatically maintained Flippy OpenWrt LTS kernels.

            Supported kernel series:

            - Linux 6.1
            - Linux 6.12
            - Linux 6.18

            Current kernel versions are recorded in `latest.json`.

            RK35xx and RK3588 specific 6.1 kernels are published
            in their own independent releases.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # Publish 6.1-rk35xx
      #
      # Tag:
      #   6.1-rk35xx
      #
      # 只上传 RK35xx。
      # ======================================================

      - name: Publish 6.1-rk35xx Release
        if: steps.result.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:

          tag_name: 6.1-rk35xx

          name: 6.1-rk35xx

          files: |
            release/6.1-rk35xx/*.tar.gz

          overwrite_files: false

          fail_on_unmatched_files: true

          body: |
            # 6.1-rk35xx

            Automatically maintained Flippy OpenWrt Linux 6.1
            kernel for RK35xx devices.

            Current kernel version is recorded in `latest.json`.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # Publish 6.1-rk3588
      #
      # Tag:
      #   6.1-rk3588
      #
      # 只上传 RK3588。
      # ======================================================

      - name: Publish 6.1-rk3588 Release
        if: steps.result.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:

          tag_name: 6.1-rk3588

          name: 6.1-rk3588

          files: |
            release/6.1-rk3588/*.tar.gz

          overwrite_files: false

          fail_on_unmatched_files: true

          body: |
            # 6.1-rk3588

            Automatically maintained Flippy OpenWrt Linux 6.1
            kernel for RK3588 devices.

            Current kernel version is recorded in `latest.json`.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # Cleanup
      # ======================================================

      - name: Cleanup Telegram session
        if: always()
        shell: bash
        run: |

          rm -f tg.session
