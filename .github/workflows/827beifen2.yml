name: Kernel LTS Stable

on:
  workflow_dispatch:

  schedule:
    # 每周四 04:33 UTC
    # 北京时间每周四 12:33
    - cron: "33 04 * * 4"


# ============================================================
# GitHub 权限
# ============================================================

permissions:
  contents: write


# ============================================================
# 防止同一个 Workflow 同时运行
#
# 如果手动运行和定时任务撞车：
#
# 第一个继续运行
# 第二个等待
#
# 不取消正在下载 Telegram 文件的任务。
# ============================================================

concurrency:
  group: kernel-lts
  cancel-in-progress: false


jobs:

  kernel:

    name: Update Kernel LTS

    runs-on: ubuntu-latest

    timeout-minutes: 120


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: false


      # ======================================================
      # Python dependencies
      #
      # 当前项目没有 requirements.txt / pyproject.toml。
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install telethon


      # ======================================================
      # Restore Telegram session
      # ======================================================

      - name: Restore Telegram session
        shell: bash
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |

          set -euo pipefail

          if [ -z "$TG_SESSION" ]; then
            echo "::error::TG_SESSION secret is empty"
            exit 1
          fi

          printf '%s' "$TG_SESSION" \
            | base64 --decode \
            > tg.session

          chmod 600 tg.session

          if [ ! -s tg.session ]; then
            echo "::error::tg.session is empty"
            exit 1
          fi

          echo "Telegram session restored"


      # ======================================================
      # Run kernel downloader
      #
      # kr2.py 根据 latest.json 比较 Telegram 最新版本。
      #
      # 本次可能：
      #
      # 0 个更新
      # 1 个更新
      # 2 个更新
      # 3 个更新
      # 4 个更新
      # 5 个更新
      #
      # 只生成实际发生变化的 release 文件。
      # ======================================================

      - name: Get latest LTS kernels
        id: kernel
        shell: bash
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
          CHAT_ID: ${{ secrets.TG_CHAT_IDFLIPPY }}

          # Telegram 最近扫描 1000 条
          SCAN_LIMIT: "1000"

        run: |

          set -euo pipefail

          python kr2.py


      # ======================================================
      # Display result
      #
      # 同时输出：
      #
      # changed
      # changed_count
      # has_changes
      #
      # changed 是 JSON 数组，例如：
      #
      # ["6.1","6.12"]
      # ======================================================

      - name: Show kernel result
        id: result
        shell: bash
        run: |

          set -euo pipefail

          if [ ! -f kernel-result.json ]; then
            echo "::error::kernel-result.json not found"
            exit 1
          fi

          echo "=========================================="
          echo "Kernel result"
          echo "=========================================="

          cat kernel-result.json

          echo

          CHANGED=$(jq -c '.changed' kernel-result.json)

          CHANGED_COUNT=$(jq '.changed | length' kernel-result.json)

          echo "=========================================="
          echo "Changed release groups"
          echo "=========================================="

          echo "$CHANGED"

          echo

          echo "Changed count: $CHANGED_COUNT"

          echo "changed=$CHANGED" \
            >> "$GITHUB_OUTPUT"

          echo "changed_count=$CHANGED_COUNT" \
            >> "$GITHUB_OUTPUT"

          if [ "$CHANGED_COUNT" -gt 0 ]; then

            echo "has_changes=true" \
              >> "$GITHUB_OUTPUT"

            echo "Kernel update detected"

          else

            echo "has_changes=false" \
              >> "$GITHUB_OUTPUT"

            echo "No kernel update"

          fi


      # ======================================================
      # Validate kernel-result.json
      #
      # 检查 kr2.py 输出结构。
      #
      # 特别注意：
      #
      # jq 中 .changed[] 会把当前输入变成字符串。
      #
      # 因此不能继续使用：
      #
      # .release_groups
      #
      # 而应该提前保存：
      #
      # (.release_groups) as $groups
      # ======================================================

      - name: Validate kernel result
        if: steps.result.outputs.has_changes == 'true'
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Validating kernel-result.json"
          echo "=========================================="


          # --------------------------------------------------
          # 检查 JSON 是否有效
          # --------------------------------------------------

          if ! jq empty kernel-result.json; then

            echo "::error::kernel-result.json is invalid JSON"

            exit 1

          fi


          echo "JSON syntax OK"


          # --------------------------------------------------
          # 检查必要字段
          # --------------------------------------------------

          for FIELD in \
            changed \
            versions \
            current_versions \
            release_groups \
            release_files
          do

            if ! jq -e \
              --arg field "$FIELD" \
              '.[$field] != null' \
              kernel-result.json \
              > /dev/null
            then

              echo "::error::Missing field: $FIELD"

              exit 1

            fi

          done


          echo "Required fields exist"


          # --------------------------------------------------
          # 检查字段类型
          # --------------------------------------------------

          jq -e '
            (.changed | type) == "array" and
            (.versions | type) == "object" and
            (.current_versions | type) == "object" and
            (.release_groups | type) == "array" and
            (.release_files | type) == "object"
          ' kernel-result.json > /dev/null


          echo "Required field types are valid"


          # --------------------------------------------------
          # 检查 changed 中的组是否合法
          #
          # 重要：
          #
          # 先保存 release_groups：
          #
          # (.release_groups) as $groups
          #
          # 然后再遍历 changed。
          #
          # 这样不会因为 .changed[] 改变 jq 当前输入
          # 而导致：
          #
          # Cannot index string with string "release_groups"
          # --------------------------------------------------

          jq -e '
            (.release_groups) as $groups |
            all(
              .changed[];
              . as $group |
              $groups |
              index($group) != null
            )
          ' kernel-result.json > /dev/null


          echo "Changed release groups are valid"


          # --------------------------------------------------
          # 检查 changed 对应的 release_files
          # --------------------------------------------------

          while IFS= read -r GROUP
          do

            FILE=$(jq -r \
              --arg group "$GROUP" \
              '.release_files[$group]' \
              kernel-result.json)


            if [ -z "$FILE" ] || [ "$FILE" = "null" ]; then

              echo "::error::No release file for changed group: $GROUP"

              exit 1

            fi


            echo "$GROUP -> $FILE"


          done < <(
            jq -r '.changed[]' kernel-result.json
          )


          # --------------------------------------------------
          # 检查 changed 对应的 versions
          # --------------------------------------------------

          while IFS= read -r GROUP
          do

            VERSION=$(jq -r \
              --arg group "$GROUP" \
              '.versions[$group]' \
              kernel-result.json)


            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then

              echo "::error::No version for changed group: $GROUP"

              exit 1

            fi


            echo "$GROUP -> $VERSION"


          done < <(
            jq -r '.changed[]' kernel-result.json
          )


          echo

          echo "=========================================="
          echo "kernel-result.json OK"
          echo "=========================================="


      # ======================================================
      # Validate changed release archives
      #
      # 只检查本次 changed 的文件。
      #
      # 不要求其它未更新的文件存在。
      # ======================================================

      - name: Validate changed release files
        if: steps.result.outputs.has_changes == 'true'
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Validating changed release files"
          echo "=========================================="


          while IFS=$'\t' read -r GROUP FILE
          do

            echo
            echo "------------------------------------------"
            echo "Release group: $GROUP"
            echo "File: $FILE"
            echo "------------------------------------------"


            if [ -z "$FILE" ] || [ "$FILE" = "null" ]; then

              echo "::error::Release file is empty for $GROUP"

              exit 1

            fi


            if [ ! -f "$FILE" ]; then

              echo "::error::Missing archive: $FILE"

              exit 1

            fi


            SIZE=$(stat -c%s "$FILE")


            if [ "$SIZE" -le 0 ]; then

              echo "::error::Archive is empty: $FILE"

              exit 1

            fi


            echo "Archive size: $SIZE bytes"
            echo "Archive OK"


          done < <(
            jq -r '
              .changed[] as $group |
              "\($group)\t\(.release_files[$group])"
            ' kernel-result.json
          )


          echo
          echo "All changed release files are valid"


      # ======================================================
      # Validate 6.1 archive
      #
      # 只有 6.1 本次发生更新才执行。
      #
      # 如果本次没有 6.1 更新：
      #
      # 不执行这个检查。
      # ======================================================

      - name: Validate 6.1 archive
        if: steps.result.outputs.has_changes == 'true' && contains(fromJSON(steps.result.outputs.changed), '6.1')
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Validating 6.1 archive"
          echo "=========================================="


          FILE=$(jq -r '.release_files["6.1"]' kernel-result.json)


          if [ ! -f "$FILE" ]; then

            echo "::error::6.1 archive not found: $FILE"

            exit 1

          fi


          rm -rf verify-61

          mkdir -p verify-61


          tar -xzf \
            "$FILE" \
            -C verify-61


          echo "Archive contents:"


          find verify-61 \
            -type f \
            -print \
            | sort


          echo


          COUNT=$(find verify-61 \
            -type f \
            | wc -l)


          echo "6.1 file count: $COUNT"


          if [ "$COUNT" -ne 8 ]; then

            echo "::error::6.1 archive should contain 8 files, found $COUNT"

            exit 1

          fi


          echo "6.1 archive OK"


      # ======================================================
      # Prepare upload files
      #
      # 根据 changed 动态处理。
      #
      # Release 映射：
      #
      # 6.1          -> kernel_stable
      # 6.12         -> kernel_stable
      # 6.18         -> kernel_stable
      #
      # 6.1-rk35xx   -> 6.1-rk35xx
      # 6.1-rk3588   -> 6.1-rk3588
      #
      # 文件名使用 versions 中的更新后版本。
      # ======================================================

      - name: Prepare release files
        if: steps.result.outputs.has_changes == 'true'
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Preparing release files"
          echo "=========================================="


          rm -rf release-upload


          mkdir -p release-upload/kernel_stable
          mkdir -p release-upload/6.1-rk35xx
          mkdir -p release-upload/6.1-rk3588


          # ==================================================
          # kernel_stable
          #
          # 6.1
          # ==================================================

          if jq -e '.changed | index("6.1")' kernel-result.json > /dev/null; then

            FILE=$(jq -r '.release_files["6.1"]' kernel-result.json)

            VERSION=$(jq -r '.versions["6.1"]' kernel-result.json)


            cp \
              "$FILE" \
              "release-upload/kernel_stable/${VERSION}.tar.gz"


            echo "kernel_stable: $VERSION.tar.gz"

          fi


          # ==================================================
          # kernel_stable
          #
          # 6.12
          # ==================================================

          if jq -e '.changed | index("6.12")' kernel-result.json > /dev/null; then

            FILE=$(jq -r '.release_files["6.12"]' kernel-result.json)

            VERSION=$(jq -r '.versions["6.12"]' kernel-result.json)


            cp \
              "$FILE" \
              "release-upload/kernel_stable/${VERSION}.tar.gz"


            echo "kernel_stable: $VERSION.tar.gz"

          fi


          # ==================================================
          # kernel_stable
          #
          # 6.18
          # ==================================================

          if jq -e '.changed | index("6.18")' kernel-result.json > /dev/null; then

            FILE=$(jq -r '.release_files["6.18"]' kernel-result.json)

            VERSION=$(jq -r '.versions["6.18"]' kernel-result.json)


            cp \
              "$FILE" \
              "release-upload/kernel_stable/${VERSION}.tar.gz"


            echo "kernel_stable: $VERSION.tar.gz"

          fi


          # ==================================================
          # 6.1-rk35xx
          # ==================================================

          if jq -e '.changed | index("6.1-rk35xx")' kernel-result.json > /dev/null; then

            FILE=$(jq -r '.release_files["6.1-rk35xx"]' kernel-result.json)

            VERSION=$(jq -r '.versions["6.1-rk35xx"]' kernel-result.json)


            cp \
              "$FILE" \
              "release-upload/6.1-rk35xx/${VERSION}.tar.gz"


            echo "6.1-rk35xx: $VERSION.tar.gz"

          fi


          # ==================================================
          # 6.1-rk3588
          # ==================================================

          if jq -e '.changed | index("6.1-rk3588")' kernel-result.json > /dev/null; then

            FILE=$(jq -r '.release_files["6.1-rk3588"]' kernel-result.json)

            VERSION=$(jq -r '.versions["6.1-rk3588"]' kernel-result.json)


            cp \
              "$FILE" \
              "release-upload/6.1-rk3588/${VERSION}.tar.gz"


            echo "6.1-rk3588: $VERSION.tar.gz"

          fi


          echo
          echo "=========================================="
          echo "Prepared release files"
          echo "=========================================="


          find release-upload \
            -type f \
            -print \
            | sort


      # ======================================================
      # Validate prepared upload files
      # ======================================================

      - name: Validate prepared release files
        if: steps.result.outputs.has_changes == 'true'
        shell: bash
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Validating prepared release files"
          echo "=========================================="


          COUNT=$(find release-upload \
            -type f \
            | wc -l)


          echo "Prepared file count: $COUNT"


          if [ "$COUNT" -le 0 ]; then

            echo "::error::No release files prepared"

            exit 1

          fi


          while IFS= read -r FILE
          do

            if [ ! -f "$FILE" ]; then

              echo "::error::Missing prepared file: $FILE"

              exit 1

            fi


            SIZE=$(stat -c%s "$FILE")


            if [ "$SIZE" -le 0 ]; then

              echo "::error::Prepared file is empty: $FILE"

              exit 1

            fi


            echo "$FILE : $SIZE bytes"


          done < <(
            find release-upload \
              -type f \
              -print
          )


          echo
          echo "All prepared release files are valid"


      # ======================================================
      # Commit latest.json
      #
      # 只有实际发生更新才提交。
      #
      # 0 个更新不会修改 latest.json。
      # ======================================================

      - name: Commit kernel state
        if: steps.result.outputs.has_changes == 'true'
        shell: bash
        run: |

          set -euo pipefail


          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add latest.json


          if git diff --cached --quiet; then

            echo "No state changes to commit"

            exit 0

          fi


          git commit \
            -m "update LTS kernel versions"


          echo "Fetching latest remote main..."


          git fetch origin main


          echo "Rebasing local commit..."


          git rebase origin/main


          echo "Pushing updated main..."


          git push origin HEAD:main


      # ======================================================
      # Publish kernel_stable
      #
      # 只有以下任意一个发生变化才执行：
      #
      # 6.1
      # 6.12
      # 6.18
      #
      # Tag：
      #
      # kernel_stable
      #
      # 每次只上传本次实际更新的文件。
      # ======================================================

      - name: Publish kernel_stable Release
        if: steps.result.outputs.has_changes == 'true' && (contains(fromJSON(steps.result.outputs.changed), '6.1') || contains(fromJSON(steps.result.outputs.changed), '6.12') || contains(fromJSON(steps.result.outputs.changed), '6.18'))
        uses: softprops/action-gh-release@v3
        with:

          tag_name: kernel_stable

          name: kernel_stable

          files: |
            release-upload/kernel_stable/*.tar.gz

          overwrite_files: false

          fail_on_unmatched_files: true

          body: |
            # kernel_stable

            Automatically maintained Flippy OpenWrt LTS kernels.

            Supported kernel series:

            - Linux 6.1
            - Linux 6.12
            - Linux 6.18

            Current kernel versions are recorded in `latest.json`.

            RK35xx and RK3588 specific Linux 6.1 kernels
            are published in their own independent releases.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # Publish 6.1-rk35xx
      #
      # 只有 6.1-rk35xx 更新才执行。
      #
      # Tag：
      #
      # 6.1-rk35xx
      # ======================================================

      - name: Publish 6.1-rk35xx Release
        if: steps.result.outputs.has_changes == 'true' && contains(fromJSON(steps.result.outputs.changed), '6.1-rk35xx')
        uses: softprops/action-gh-release@v3
        with:

          tag_name: 6.1-rk35xx

          name: 6.1-rk35xx

          files: |
            release-upload/6.1-rk35xx/*.tar.gz

          overwrite_files: false

          fail_on_unmatched_files: true

          body: |
            # 6.1-rk35xx

            Automatically maintained Flippy OpenWrt Linux 6.1
            kernel for RK35xx devices.

            Current kernel version is recorded in `latest.json`.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # Publish 6.1-rk3588
      #
      # 只有 6.1-rk3588 更新才执行。
      #
      # Tag：
      #
      # 6.1-rk3588
      # ======================================================

      - name: Publish 6.1-rk3588 Release
        if: steps.result.outputs.has_changes == 'true' && contains(fromJSON(steps.result.outputs.changed), '6.1-rk3588')
        uses: softprops/action-gh-release@v3
        with:

          tag_name: 6.1-rk3588

          name: 6.1-rk3588

          files: |
            release-upload/6.1-rk3588/*.tar.gz

          overwrite_files: false

          fail_on_unmatched_files: true

          body: |
            # 6.1-rk3588

            Automatically maintained Flippy OpenWrt Linux 6.1
            kernel for RK3588 devices.

            Current kernel version is recorded in `latest.json`.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # Cleanup
      # ======================================================

      - name: Cleanup Telegram session
        if: always()
        shell: bash
        run: |

          rm -f tg.session
