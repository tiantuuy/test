name: Kernel stable

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 2   # 整个任务最大2分钟

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install --no-cache-dir telethon

      - name: Restore session
        run: |
          echo "${{ secrets.TG_SESSION }}" | base64 -d > tg.session
          ls -l tg.session

      - name: Fetch latest kernels
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
          CHAT_ID: ${{ secrets.TG_CHAT_IDFLIPPY }}
        run: |
          python << 'PY'
          import re, os, hashlib, datetime, sys
          from telethon import TelegramClient

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          chat_id = int(os.environ["CHAT_ID"])

          TARGET_PREFIX = ("6.12.", "6.18.")

          def sha256sum(path):
              import hashlib
              h = hashlib.sha256()
              with open(path,"rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""):
                      h.update(c)
              return h.hexdigest()

          def load_last():
              if not os.path.exists(".last_kernel"):
                  return {}
              d={}
              for line in open(".last_kernel"):
                  k,v=line.strip().split("=")
                  d[k]=v
              return d

          def save_last(d):
              with open(".last_kernel","w") as f:
                  for k,v in d.items():
                      f.write(f"{k}={v}\n")

          async def find_latest(client, prefix):
              targets={
                  "header":"header-",
                  "modules":"modules-",
                  "boot":"boot-",
                  "dtb-amlogic":"dtb-amlogic-",
              }

              files={}
              ver_found=None

              async for msg in client.iter_messages(chat_id, limit=80):
                  if not msg.file:
                      continue

                  name=msg.file.name or ""
                  if prefix not in name:
                      continue

                  m=re.search(r'(\d+\.\d+\.\d+-flippy-\d+\+)',name)
                  if not m:
                      continue

                  ver=m.group(1)

                  if ver_found is None:
                      ver_found=ver
                      print("Latest",prefix,ver_found)

                  if ver!=ver_found:
                      break

                  for k,p in targets.items():
                      if name.startswith(p):
                          files[k]=msg

                  if len(files)==4:
                      return ver_found,files

              return None,None

          async def main():
              client=TelegramClient("tg",api_id,api_hash)

              print("Connecting Telegram…")
              await client.connect()

              if not await client.is_user_authorized():
                  print("ERROR: Telegram session invalid")
                  return

              print("Telegram OK")

              last=load_last()
              new_last=dict(last)

              os.makedirs("dist",exist_ok=True)
              updated=False
              changelog=[]

              for pref in TARGET_PREFIX:
                  ver,files=await find_latest(client,pref)
                  if not ver:
                      continue

                  if last.get(pref)==ver:
                      print("No change",pref)
                      continue

                  print("NEW",pref,ver)
                  updated=True
                  new_last[pref]=ver

                  base=f"dl/{ver}"
                  os.makedirs(base,exist_ok=True)

                  for k,msg in files.items():
                      out=f"{base}/{k}.tar.gz"
                      await msg.download_media(out)

                  tar=f"dist/{ver}.tar.gz"
                  os.system(f"tar -czf {tar} -C dl {ver}")

                  sha=sha256sum(tar)
                  changelog.append(f"## {ver}\n- sha256: `{sha}`\n")

              await client.disconnect()

              if not updated:
                  print("No kernel updates")
                  return

              save_last(new_last)

              with open("dist/CHANGELOG.md","w") as f:
                  f.write(f"# Kernel builds {datetime.date.today()}\n\n")
                  f.write("\n".join(changelog))

          import asyncio
          asyncio.run(main())
          PY

      - name: Commit state
        run: |
          if [ -f .last_kernel ]; then
            git config user.name github-actions
            git config user.email actions@github.com
            git add .last_kernel
            git commit -m "update kernel state" || true
            git push || true
          fi

      - name: Release
        if: hashFiles('dist/*.tar.gz') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel_stable
          name: Kernel_Stable
          files: |
            dist/*.tar.gz
            dist/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
