name: Kernel stable

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # 每6小时检查

jobs:
  kernel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install telethon

      - name: Restore session
        run: echo "${{ secrets.TG_SESSION }}" | base64 -d > tg.session

      - name: Download latest kernels
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
          CHAT_ID: ${{ secrets.TG_CHAT_IDFLIPPY }}
        run: |
          python << 'PY'
          import re, os, hashlib, datetime, sys
          from telethon import TelegramClient

          api_id = int(os.environ["API_ID"])
          api_hash = os.environ["API_HASH"]
          chat_id = int(os.environ["CHAT_ID"])

          TARGET_PREFIX = ("6.12.", "6.18.")

          client = TelegramClient("tg", api_id, api_hash)

          def sha256sum(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024*1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def load_last():
              if not os.path.exists(".last_kernel"):
                  return {}
              data = {}
              for line in open(".last_kernel"):
                  k,v = line.strip().split("=")
                  data[k]=v
              return data

          def save_last(d):
              with open(".last_kernel","w") as f:
                  for k,v in d.items():
                      f.write(f"{k}={v}\n")

          async def find_latest(prefix):
              targets = {
                  "header": "header-",
                  "modules": "modules-",
                  "boot": "boot-",
                  "dtb-amlogic": "dtb-amlogic-",
              }

              files = {}
              ver_found = None

              async for msg in client.iter_messages(chat_id):
                  if not msg.file:
                      continue

                  name = msg.file.name or ""
                  if prefix not in name:
                      continue

                  m = re.search(r'(\d+\.\d+\.\d+-flippy-\d+\+)', name)
                  if not m:
                      continue

                  ver = m.group(1)

                  if ver_found is None:
                      ver_found = ver

                  if ver != ver_found:
                      break

                  for k,p in targets.items():
                      if name.startswith(p):
                          files[k] = msg

                  if len(files)==4:
                      return ver_found, files

              return None, None

          async def main():
              await client.start()

              last = load_last()
              new_last = dict(last)

              os.makedirs("dist", exist_ok=True)
              changelog = []
              updated = False

              for pref in TARGET_PREFIX:
                  ver, files = await find_latest(pref)
                  if not ver:
                      continue

                  print("Latest", pref, ver)

                  if last.get(pref) == ver:
                      print("No change:", pref)
                      continue

                  print("NEW:", pref, ver)
                  updated = True
                  new_last[pref] = ver

                  base_dir = f"dl/{ver}"
                  os.makedirs(base_dir, exist_ok=True)

                  for k,msg in files.items():
                      out = f"{base_dir}/{k}.tar.gz"
                      await msg.download_media(out)

                  tar_name = f"dist/{ver}.tar.gz"
                  os.system(f"tar -czf {tar_name} -C dl {ver}")

                  sha = sha256sum(tar_name)
                  changelog.append(f"## {ver}\n- sha256: `{sha}`\n")

              if not updated:
                  print("No kernel updates")
                  sys.exit(0)

              save_last(new_last)

              with open("dist/CHANGELOG.md","w") as f:
                  f.write(f"# Kernel builds {datetime.date.today()}\n\n")
                  f.write("\n".join(changelog))

          with client:
              client.loop.run_until_complete(main())
          PY

      - name: Commit state
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add .last_kernel || true
          git commit -m "update kernel state" || true
          git push || true

      - name: Upload release
        if: hashFiles('dist/*.tar.gz') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel_stable
          name: Kernel_Stable
          files: |
            dist/*.tar.gz
            dist/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
